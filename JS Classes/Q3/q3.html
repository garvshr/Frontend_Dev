<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q3 Library Management</title>
  <style>
    .book-list {
      margin-top: 10px;
    }
    .book-item {
      margin-bottom: 4px;
    }
    .msg {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Library Management</h1>

    <button type="submit">Issue</button>

  <div id="issueMsg" class="msg"></div>

  <script src="q3.js"></script>

</html>
