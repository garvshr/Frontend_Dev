<!DOCTYPE html>
<html>
<head>
<title>Timetable Viewer</title>
<script>
function loadTimetable(day) {
  fetch(`http://localhost:3005/timetable?day=${day}`)
    .then(r => r.json())
    .then(data => {
      var container = document.getElementById('timetable');
      container.innerHTML = '';
      if(data.length === 0){
        container.innerHTML = '<p>No classes today.</p>';
      } else {
        data.forEach(tt => {
          container.innerHTML += `<div>${tt.subject} - ${tt.faculty} - ${tt.time}</div>`;
        });
      }
    });
}
</script>
</head>
<body>
<select onchange="loadTimetable(this.value)">
  <option value="Monday">Monday</option>
  <option value="Tuesday">Tuesday</option>
  <option value="Wednesday">Wednesday</option>
  <option value="Thursday">Thursday</option>
  <option value="Friday">Friday</option>
</select>
<div id="timetable"></div>
<script>loadTimetable('Monday');</script>
</body>
</html>
