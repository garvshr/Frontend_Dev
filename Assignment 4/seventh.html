<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q10: Navigation Bar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        main {
            padding: 2rem;
            text-align: center;
            min-height: 70vh; 
        }
        .navbar {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            background-color: #333;
            padding: 0 2rem;
            flex-wrap: wrap; 
        }
        .nav-brand {
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 1rem 0;
        }
        .nav-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .nav-link {
            display: block;
            color: white;
            text-decoration: none;
            padding: 1.5rem 1rem; 
            border-bottom: 3px solid transparent; 
                        transition: all 0.3s ease;
        }

        .nav-link:hover {
            background-color: #555;
            border-bottom-color: #f0ad4e; 
        }
        .nav-item.active .nav-link {
            background-color: #444;
            border-bottom-color: #d9534f; 
            font-weight: bold;
        }

        footer {
            background-color: #f4f4f4;
            color: #555;
            text-align: center;
            padding: 2rem 0;
            border-top: 1px solid #ddd;
        }

        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
                padding: 0;
            }
            
            .nav-brand {
                width: 100%;
                text-align: center;
                border-bottom: 1px solid #444;
            }

            .nav-menu {
                flex-direction: column;
                width: 100%; 
            }
            
            .nav-link {
                text-align: center;
                border-bottom: 1px solid #444; 
            }
                        .nav-link:hover,
            .nav-item.active .nav-link {
                border-bottom-color: transparent;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="#" class="nav-brand">Logo</a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
                <li class="nav-item active"><a href="#" class="nav-link">About</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Services</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Portfolio</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Responsive Navigation Bar Page</h1>
        <p>Resize the browser window below 700px to see the navigation stack vertically.</p>
    </main>

    <footer>
        <p>&copy; 2025 Simple Footer Text</p>
    </footer>
</body>
</html>
