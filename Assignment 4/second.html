<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6: Transformations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
        }

        header {
            margin: 2rem 0;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            flex-wrap: wrap;
            padding: 3rem;
            perspective: 1000px;
        }

        .box-wrapper {
            height: 150px;
            width: 150px;
        }
        .box {
            width: 150px;
            height: 150px;
            background-color: #3498db;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
                        display: flex;
            justify-content: center;
            align-items: center;
                        transition: all 0.4s ease;
        }
        .rotate:hover {
            transform: rotate(45deg);
            background-color: #2980b9;
        }

        .scale:hover {
            transform: scale(1.2); 
            background-color: #2ecc71;
        }
        .translate:hover {
            transform: translate(25px, 25px);
            background-color: #e67e22;
        }
        .skew:hover {
            transform: skew(20deg, 10deg);
            background-color: #9b59b6;
        }
    </style>
</head>
<body>
    <header>
        <h1>CSS Transformations on Hover</h1>
    </header>
    <main class="container">
        
        <div class="box-wrapper">
            <div class="box rotate">Rotate</div>
            <p>rotate(45deg)</p>
        </div>
        
        <div class="box-wrapper">
            <div class="box scale">Scale</div>
            <p>scale(1.2)</p>
        </div>

        <div class="box-wrapper">
            <div class="box translate">Translate</div>
            <p>translate(25px, 25px)</p>
        </div>

        <div class="box-wrapper">
            <div class="box skew">Skew</div>
            <p>skew(20deg, 10deg)</p>
        </div>

    </main>
</body>
</html>
