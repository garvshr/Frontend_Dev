<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>CSS Tooltips</h1>
  </header>
  <main class="center">
    <section class="tooltip-grid">
      <div class="tip" data-tip="Search anything">🔍</div>
      <div class="tip" data-tip="Notifications">🔔</div>
      <div class="tip" data-tip="Settings">⚙️</div>
      <div class="tip word" data-tip="Helpful hint">Hover me</div>
      <div class="tip word" data-tip="More info">Info</div>
    </section>
  </main>
  <footer>
    <p>Tooltips appear above elements</p>
  </footer>
</body>

</html>
