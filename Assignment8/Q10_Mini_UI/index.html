<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini UI Layout</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header">
    <h1>Mini Layout</h1>
  </header>
  <main class="layout">
    <section class="card">
      <div class="left">
        <img src="https://picsum.photos/seed/ui/160/120" alt="Small">
      </div>
      <form class="right">
        <label>
          Name
          <input type="text" placeholder="Your name">
        </label>
        <label>
          Email
          <input type="email" placeholder="you@example.com">
        </label>
        <div class="actions">
          <button class="btn primary" type="submit">Save</button>
          <button class="btn outline" type="button">Cancel</button>
        </div>
      </form>
    </section>
  </main>
  <footer class="site-footer">
    <p>Responsive and accessible</p>
  </footer>
</body>

</html>
