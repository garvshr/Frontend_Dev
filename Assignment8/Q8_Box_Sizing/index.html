<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box-Sizing Comparison</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Box-Sizing Comparison</h1>
  </header>
  <main class="center">
    <section class="compare">
      <div class="box content-box">
        <h2>Default</h2>
        <p>Width set to 300px with padding and border added outside.</p>
      </div>
      <div class="box border-box">
        <h2>border-box</h2>
        <p>Width set to 300px with padding and border included inside.</p>
      </div>
    </section>
  </main>
  <footer>
    <p>Resize the window to see responsiveness</p>
  </footer>
</body>

</html>
