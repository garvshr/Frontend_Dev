<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Image Showcase</h1>
  </header>
  <main>
    <section class="gallery">
      <figure>
        <div class="imgwrap"><img src="https://picsum.photos/seed/1/400/300" alt="Random"></div>
        <figcaption>Caption One</figcaption>
      </figure>
      <figure>
        <div class="imgwrap"><img src="https://picsum.photos/seed/2/400/300" alt="Random"></div>
        <figcaption>Caption Two</figcaption>
      </figure>
      <figure>
        <div class="imgwrap"><img src="https://picsum.photos/seed/3/400/300" alt="Random"></div>
        <figcaption>Caption Three</figcaption>
      </figure>
      <figure>
        <div class="imgwrap"><img src="https://picsum.photos/seed/4/400/300" alt="Random"></div>
        <figcaption>Caption Four</figcaption>
      </figure>
      <figure>
        <div class="imgwrap"><img src="https://picsum.photos/seed/5/400/300" alt="Random"></div>
        <figcaption>Caption Five</figcaption>
      </figure>
      <figure>
        <div class="imgwrap"><img src="https://picsum.photos/seed/6/400/300" alt="Random"></div>
        <figcaption>Caption Six</figcaption>
      </figure>
    </section>
  </main>
  <footer>
    <p>Hover to see effects</p>
  </footer>
</body>

</html>
