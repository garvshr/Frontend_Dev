<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .calculator {
            background: black;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            width: 400px;
        }

        .display {
            background: #3a3a4a;
            border-radius: 15px;
            padding: 25px 20px;
            margin-bottom: 20px;
            text-align: right;
            color: #d0e8e0;
            font-size: 48px;
            font-weight: 300;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            border: none;
            border-radius: 15px;
            font-size: 24px;
            padding: 25px;
            cursor: pointer;
            font-weight: 400;
        }

        .gray {
            background: #b8cec7;
            color: #4a4a5a;
        }

        .dark {
            background: #4a4a5a;
            color: #b8cec7;
        }

        .yellow {
            background: #e6b34a;
            color: white;
            font-size: 32px;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">0</div>
        <div class="buttons">
            <button class="gray">AC</button>
            <button class="gray">±</button>
            <button class="gray">%</button>
            <button class="yellow">÷</button>
            
            <button class="dark">7</button>
            <button class="dark">8</button>
            <button class="dark">9</button>
            <button class="yellow">x</button>
            
            <button class="dark">4</button>
            <button class="dark">5</button>
            <button class="dark">6</button>
            <button class="yellow">-</button>
            
            <button class="dark">1</button>
            <button class="dark">2</button>
            <button class="dark">3</button>
            <button class="yellow">+</button>
            
            <button class="dark zero">0</button>
            <button class="dark">.</button>
            <button class="yellow">=</button>
        </div>
    </div>
</body>
</html>
